<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content, overHero)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title th:replace="${title}">MadelMade</title>
  <meta name="description" content="Customized sourdough loaves for any occasion, home-baked in Brentwood, TN.">
  <meta name="theme-color" content="#F4EFE4">
  <link rel="icon" type="image/svg+xml" th:href="@{/img/madelmade-logo-simple.svg}">
  <link rel="apple-touch-icon" th:href="@{/img/madelmade-logo-simple.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Nunito:wght@800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
  <a class="visually-hidden" href="#main">Skip to content</a>
  <header th:replace="~{components/header :: header(${overHero})}"></header>
  <div th:replace="~{components/flash :: flash}"></div>
  <main id="main" th:replace="${content}"></main>
  <footer th:replace="~{components/footer :: footer}"></footer>
  <div th:replace="~{components/cart-drawer :: drawer}"></div>
  <details th:replace="~{components/feedback :: button}"></details>
  <script th:src="@{/js/site.js}" defer></script>
</body>
</html>
