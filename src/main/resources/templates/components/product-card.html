<!-- Product card: used for bread, coffee and anything added later. -->
<a th:fragment="card(p)" class="product-card" th:classappend="${p.soldOut} ? 'is-sold-out'"
   th:href="@{/p/{slug}(slug=${p.slug})}" th:data-category="${p.category.slug}">
  <img th:if="${p.photoId != null}" class="photo" th:src="@{/photos/{id}(id=${p.photoId})}" th:alt="${p.name}" loading="lazy" width="400" height="400">
  <div th:unless="${p.photoId != null}" class="photo-placeholder" aria-hidden="true">
    <img th:src="@{/img/madelmade-logo-simple.svg}" alt="" style="width: 34%; opacity: .55">
  </div>
  <span class="card-badge" th:if="${p.soldOut}">Sold out</span>
  <span class="card-badge" th:if="${!p.soldOut and p.badge != null}" th:text="${p.badge}">Not sourdough</span>
  <div class="product-card-body">
    <div class="product-card-name" th:text="${p.name}">Classic Loaf</div>
    <div class="product-card-price">
      <span th:text="${(p.buildYourOwn and p.category.slug == 'bread' ? 'from ' : '') + @money.fmt(p.basePrice)}">$10</span><span th:if="${p.shortDescription != null and p.category.slug != 'bread'}" th:text="${' · ' + p.shortDescription}"> · hot or iced</span><span th:if="${p.category.slug == 'bread' and p.buildYourOwn}"> · build your own</span>
    </div>
  </div>
</a>
