<table th:fragment="lines(order)" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #DDD5C4;margin:16px 0;">
  <tr th:each="i : ${order.items}">
    <td style="padding:10px 0;border-bottom:1px solid #DDD5C4;font-size:14px;">
      <strong><span th:if="${i.quantity > 1}" th:text="${i.quantity + ' × '}"></span><span th:text="${i.productName}">Loaf</span></strong>
      <div th:if="${i.optionsSummary != null and !i.optionsSummary.isEmpty()}" style="color:#5C5A50;font-size:13px;" th:text="${i.optionsSummary}"></div>
      <div th:if="${i.customNotes != null}" style="color:#5C5A50;font-size:13px;" th:text="${'Note: ' + i.customNotes}"></div>
      <div th:if="${i.hasCertificate}" style="margin-top:4px;padding-left:10px;border-left:2px solid #DDD5C4;font-size:13px;color:#3D3F36;"
           th:text="${'Birth certificate +' + money.fmt(i.certPrice) + ': ' + i.certName}"></div>
    </td>
    <td align="right" valign="top" style="padding:10px 0;border-bottom:1px solid #DDD5C4;font-size:14px;color:#7A4A2B;font-weight:600;white-space:nowrap;"
        th:text="${i.priceTbd ? 'To be discussed' : money.fmt(i.lineTotal)}">$10</td>
  </tr>
  <tr th:if="${order.priority}"><td style="padding:6px 0;font-size:14px;">Priority</td><td align="right" style="font-size:14px;" th:text="${money.fmt(order.priorityFee)}"></td></tr>
  <tr th:if="${order.delivery}"><td style="padding:6px 0;font-size:14px;">Delivery</td><td align="right" style="font-size:14px;" th:text="${order.deliveryFee != null ? money.fmt(order.deliveryFee) : 'Quoted by Madeline'}"></td></tr>
  <tr th:if="${order.hasDiscount}"><td style="padding:6px 0;font-size:14px;" th:text="${'Promo ' + order.promoLabel}"></td><td align="right" style="font-size:14px;color:#2F5D3A;" th:text="${'−' + money.fmt(order.discount)}"></td></tr>
  <tr th:if="${order.adjustment != null and order.adjustment.signum() != 0}"><td style="padding:6px 0;font-size:14px;" th:text="${order.adjustmentNote != null ? order.adjustmentNote : 'Adjustment'}"></td><td align="right" style="font-size:14px;" th:text="${money.fmt(order.adjustment)}"></td></tr>
  <tr><td style="padding:10px 0;font-size:15px;font-weight:700;">Total</td>
      <td align="right" style="padding:10px 0;font-size:15px;font-weight:700;" th:text="${money.fmt(order.total) + (order.priceTbd ? ' + custom' : '')}">$26</td></tr>
</table>
