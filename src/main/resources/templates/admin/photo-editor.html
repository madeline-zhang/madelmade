<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: page(~{::title}, ~{::main}, ${section})}">
<head><title>Photo editor · MadelMade admin</title></head>
<body>
<main id="main" class="admin-main">
  <a class="back-link" th:href="${target.back}">←&nbsp;&nbsp;Back</a>
  <div class="admin-head">
    <div class="stack" style="gap: 4px"><div class="t-eyebrow">Photo editor</div><h1 th:text="${target.title}">Classic Loaf</h1></div>
  </div>

  <div class="editor" data-editor
       th:data-target="${target.key}"
       th:data-original="${photo != null ? '/admin/photos/' + photo.id + '/original' : ''}"
       th:data-aspect="${aspect}"
       th:data-rotate="${defaultRotate}" th:data-tilt="${defaultTilt}" th:data-crop="${defaultCrop}"
       th:data-brightness="${defaultBrightness}" th:data-contrast="${defaultContrast}"
       th:data-saturation="${defaultSaturation}" th:data-warmth="${defaultWarmth}"
       th:data-fresh="${settings.get('photos.brightness') + ',' + settings.get('photos.contrast') + ',' + settings.get('photos.saturation') + ',' + settings.get('photos.warmth')}">
    <div class="stack">
      <div class="editor-stage">
        <canvas data-canvas width="800" height="800" aria-label="Photo preview. Drag the corners of the crop box to resize it, or drag inside it to move it."></canvas>
        <p class="muted" data-empty th:if="${photo == null}">Choose a photo to start.</p>
      </div>
      <div class="compare">
        <button type="button" class="btn btn-secondary btn-small" data-hold-original>Hold to see the original</button>
        <span class="t-small muted">Drag the corners to resize the crop. Drag inside it to move it.</span>
      </div>
    </div>

    <div class="editor-controls card">
      <div class="field">
        <label for="file" th:text="${photo == null ? 'Choose a photo' : 'Replace with a new photo'}">Choose a photo</label>
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp" data-file>
        <div class="help">JPEG or PNG from your phone or computer. The original is always kept.</div>
      </div>

      <div class="field">
        <span class="label">Crop</span>
        <div class="t-small" th:text="${aspectLabel}">Square, to match the menu</div>
        <div class="action-row">
          <button type="button" class="btn btn-secondary btn-small" data-rotate="-90">↺ Rotate left</button>
          <button type="button" class="btn btn-secondary btn-small" data-rotate="90">Rotate right ↻</button>
          <button type="button" class="link-btn" data-reset-crop>Reset crop</button>
        </div>
      </div>

      <div class="range-row">
        <div class="top"><label for="tilt">Straighten</label><span data-out="tilt">0°</span></div>
        <input type="range" id="tilt" min="-45" max="45" step="0.1" data-input="tilt">
      </div>

      <div class="range-row">
        <div class="top"><label for="brightness">Brightness</label><span data-out="brightness">0</span></div>
        <input type="range" id="brightness" min="-100" max="100" step="1" data-input="brightness">
      </div>
      <div class="range-row">
        <div class="top"><label for="contrast">Contrast</label><span data-out="contrast">0</span></div>
        <input type="range" id="contrast" min="-100" max="100" step="1" data-input="contrast">
      </div>
      <div class="range-row">
        <div class="top"><label for="saturation">Saturation</label><span data-out="saturation">0</span></div>
        <input type="range" id="saturation" min="-100" max="100" step="1" data-input="saturation">
      </div>
      <div class="range-row">
        <div class="top"><label for="warmth">Warmth</label><span data-out="warmth">0</span></div>
        <input type="range" id="warmth" min="-100" max="100" step="1" data-input="warmth">
      </div>
      <div class="help">Double-click a slider to set it back to 0. <button type="button" class="link-btn" data-reset-adjust>Reset all sliders</button></div>

      <div class="field" th:if="${target.key.startsWith('gallery') or target.key.startsWith('other')}">
        <label for="caption">Caption</label>
        <input type="text" id="caption" maxlength="200" data-caption placeholder="e.g. Miriam's double leaf">
      </div>

      <div class="alert alert-error hidden" role="alert" data-error></div>
      <button type="button" class="btn" data-save>Save photo</button>
      <a class="btn btn-secondary" th:href="${target.back}">Cancel</a>
    </div>
  </div>

  <form method="post" th:action="@{/admin/photos/remove}" th:if="${photo != null}" data-confirm="Remove this photo?">
    <input type="hidden" name="target" th:value="${target.key}">
    <button type="submit" class="link-btn" th:text="${target.key.startsWith('gallery') ? 'Remove from gallery' : 'Remove photo'}">Remove photo</button>
  </form>
  <script th:src="@{/js/photo-editor.js}" defer></script>
</main>
</body>
</html>
