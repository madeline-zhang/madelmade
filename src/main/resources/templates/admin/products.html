<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: page(~{::title}, ~{::main}, 'products')}">
<head><title>Products · MadelMade admin</title></head>
<body>
<main id="main" class="admin-main">
  <div class="admin-head">
    <div class="stack" style="gap: 4px"><div class="t-eyebrow">Menu</div><h1>Products</h1></div>
    <a class="btn" th:href="@{/admin/products/new}">Add a product</a>
  </div>
  <div th:replace="~{admin/product-tabs :: tabs('products')}"></div>

  <div class="table-wrap">
    <table class="table">
      <thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>On menu</th><th>Sold out</th><th></th></tr></thead>
      <tbody>
        <tr th:each="p : ${products}">
          <td><a th:href="@{/admin/photos/edit(target=${'product-' + p.id})}" title="Edit photo">
            <img th:if="${p.photoId != null}" class="thumb-sm" th:src="${photoUrls.src(p.photoId)}" alt="">
            <span th:unless="${p.photoId != null}" class="thumb-sm photo-slot" style="border-radius: 10px">Add photo</span></a></td>
          <td><a th:href="@{/admin/products/{id}(id=${p.id})}" style="font-weight: 600" th:text="${p.name}">Classic Loaf</a>
            <div class="t-small muted" th:text="${p.allOptionGroups.size() + ' option group' + (p.allOptionGroups.size() == 1 ? '' : 's')}"></div></td>
          <td th:text="${p.category.name}">Bread</td>
          <td th:text="${@money.fmt(p.basePrice)}">$10</td>
          <td><form method="post" th:action="@{/admin/products/{id}/toggle(id=${p.id})}"><input type="hidden" name="field" value="active">
            <label class="switch"><input type="checkbox" th:checked="${p.active}" data-autosubmit th:aria-label="${'Show ' + p.name + ' on the menu'}"><span></span></label></form></td>
          <td><form method="post" th:action="@{/admin/products/{id}/toggle(id=${p.id})}"><input type="hidden" name="field" value="soldOut">
            <label class="switch"><input type="checkbox" th:checked="${p.soldOut}" data-autosubmit th:aria-label="${'Mark ' + p.name + ' sold out'}"><span></span></label></form></td>
          <td><a class="btn btn-secondary btn-small" th:href="@{/admin/products/{id}(id=${p.id})}">Edit</a></td>
        </tr>
      </tbody>
    </table>
  </div>

  <section class="card" aria-labelledby="cats">
    <h2 id="cats" class="card-title">Categories</h2>
    <p class="t-small muted" style="margin-top: -6px">These become the menu tabs. Lower numbers show first.</p>
    <div class="stack" style="gap: 10px">
      <div th:each="c : ${categories}" style="display: flex; gap: 10px; align-items: end; flex-wrap: wrap">
        <form method="post" th:action="@{/admin/categories/{id}(id=${c.id})}" style="display: flex; gap: 10px; align-items: end; flex-wrap: wrap">
          <div class="field"><label th:for="${'cat-' + c.id}">Name</label><input type="text" th:id="${'cat-' + c.id}" name="name" th:value="${c.name}"></div>
          <div class="field" style="width: 90px"><label th:for="${'cat-o-' + c.id}">Order</label><input type="number" th:id="${'cat-o-' + c.id}" name="displayOrder" th:value="${c.displayOrder}"></div>
          <button type="submit" class="btn btn-secondary btn-small">Save</button>
        </form>
        <form method="post" th:action="@{/admin/categories/{id}/delete(id=${c.id})}" data-confirm="Delete this category?"><button type="submit" class="link-btn">Delete</button></form>
      </div>
      <form method="post" th:action="@{/admin/categories}" style="display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-top: 8px">
        <div class="field"><label for="newcat">New category</label><input type="text" id="newcat" name="name" placeholder="e.g. Extras"></div>
        <button type="submit" class="btn btn-small">Add</button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
