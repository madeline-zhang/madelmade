<!-- One option group with its choices, on a product page or the Shared options page. -->
<div th:fragment="card(g)" class="group-card" th:id="${'group-' + g.id}">
  <form method="post" th:action="@{/admin/groups/{id}(id=${g.id})}" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: end">
    <div class="field" style="flex: 1 1 180px"><label th:for="${'g-n-' + g.id}">Group name</label><input type="text" th:id="${'g-n-' + g.id}" name="name" th:value="${g.name}"></div>
    <div class="field"><label th:for="${'g-s-' + g.id}">Shown as</label>
      <select th:id="${'g-s-' + g.id}" name="displayStyle">
        <option value="buttons" th:selected="${!g.swatches}">Buttons</option>
        <option value="swatches" th:selected="${g.swatches}">Photo swatches</option>
      </select></div>
    <div class="field" style="width: 80px"><label th:for="${'g-o-' + g.id}">Order</label><input type="number" th:id="${'g-o-' + g.id}" name="displayOrder" th:value="${g.displayOrder}"></div>
    <label class="check-row t-small"><input type="checkbox" name="required" value="true" th:checked="${g.required}"> Required</label>
    <label class="check-row t-small"><input type="checkbox" name="multiple" value="true" th:checked="${g.multiple}"> Pick several</label>
    <button type="submit" class="btn btn-secondary btn-small">Save group</button>
  </form>

  <div class="choice-row" th:each="c : ${g.choices}">
    <a class="photo-slot" th:href="@{/admin/photos/edit(target=${'choice-' + c.id})}" th:title="${'Photo for ' + c.name}">
      <img th:if="${c.photoId != null}" th:src="${photoUrls.src(c.photoId)}" alt="">
      <span th:unless="${c.photoId != null}">Add photo</span>
    </a>
    <form method="post" th:action="@{/admin/choices/{id}(id=${c.id})}" th:id="${'choice-' + c.id}" style="display: contents">
      <div class="field"><label class="visually-hidden" th:for="${'c-n-' + c.id}">Name</label><input type="text" th:id="${'c-n-' + c.id}" name="name" th:value="${c.name}"></div>
      <div class="field"><label class="visually-hidden" th:for="${'c-p-' + c.id}">Price change</label><div class="price-input">+$<input type="number" step="0.01" th:id="${'c-p-' + c.id}" name="priceChange" th:value="${@money.plain(c.priceChange)}" style="width: 72px !important"></div></div>
      <div class="row-actions" style="display: flex; gap: 6px">
        <button type="submit" class="btn btn-secondary btn-small">Save</button>
      </div>
      <div class="field desc"><label class="visually-hidden" th:for="${'c-d-' + c.id}">Description</label><textarea th:id="${'c-d-' + c.id}" name="description" rows="2" th:text="${c.description}" placeholder="Short description (shown with photo swatches)"></textarea></div>
      <div class="field-row desc">
        <div class="field"><label class="t-small" th:for="${'c-i-' + c.id}">Adds ingredients</label><input type="text" th:id="${'c-i-' + c.id}" name="ingredients" maxlength="500" th:value="${c.ingredients}" placeholder="e.g. rosemary, garlic"></div>
        <div class="field"><label class="t-small" th:for="${'c-a-' + c.id}">Adds allergens</label><input type="text" th:id="${'c-a-' + c.id}" name="allergens" maxlength="300" th:value="${c.allergens}" placeholder="e.g. milk"></div>
      </div>
      <div class="flags">
        <label><input type="checkbox" name="active" value="true" th:checked="${c.active}"> Offered</label>
        <label><input type="checkbox" name="defaultChoice" value="true" th:checked="${c.defaultChoice}"> Picked by default</label>
        <label><input type="checkbox" name="halvesPrice" value="true" th:checked="${c.halvesPrice}"> Half price (half loaf)</label>
        <label><input type="checkbox" name="priceTbd" value="true" th:checked="${c.priceTbd}"> Price discussed</label>
        <label><input type="checkbox" name="needsDesignApproval" value="true" th:checked="${c.needsDesignApproval}"> Design needs approval</label>
        <label>Text up to <input type="number" min="0" max="40" name="textLimit" th:value="${c.textLimit}" style="width: 60px; min-height: 32px; border: 1px solid var(--color-line); border-radius: 6px; padding: 2px 6px"> characters</label>
        <label>Order <input type="number" name="displayOrder" th:value="${c.displayOrder}" style="width: 56px; min-height: 32px; border: 1px solid var(--color-line); border-radius: 6px; padding: 2px 6px"></label>
      </div>
    </form>
    <form method="post" th:action="@{/admin/choices/{id}/delete(id=${c.id})}" data-confirm="Remove this choice?" style="grid-column: 2 / -1"><button type="submit" class="link-btn" th:text="${'Remove ' + c.name}">Remove</button></form>
  </div>

  <form method="post" th:action="@{/admin/groups/{id}/choices(id=${g.id})}" style="display: flex; gap: 10px; align-items: end; flex-wrap: wrap; border-top: 1px solid var(--color-linen); padding-top: 14px">
    <div class="field"><label th:for="${'nc-' + g.id}">New choice</label><input type="text" th:id="${'nc-' + g.id}" name="name" placeholder="e.g. Cinnamon raisin"></div>
    <div class="field"><label th:for="${'ncp-' + g.id}">Price change</label><div class="price-input">+$<input type="number" step="0.01" th:id="${'ncp-' + g.id}" name="priceChange" value="0"></div></div>
    <button type="submit" class="btn btn-small">Add choice</button>
  </form>
  <form method="post" th:action="@{/admin/groups/{id}/delete(id=${g.id})}" th:data-confirm="${g.shared ? 'Remove this group from every product that uses it?' : 'Remove this whole option group?'}"><button type="submit" class="link-btn" th:text="${'Remove the ' + g.name + ' group'}">Remove group</button></form>
</div>
