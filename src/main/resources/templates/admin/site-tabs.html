<!-- Switches between the parts of the public website Madeline edits. -->
<div th:fragment="tabs(tab)" class="tabs" style="margin-bottom: 4px">
  <a class="pill" th:classappend="${tab == 'hero'} ? 'is-on'" th:href="@{/admin/hero}">Home page</a>
  <a class="pill" th:classappend="${tab == 'process'} ? 'is-on'" th:href="@{/admin/process}">How it's made</a>
  <a class="pill" th:classappend="${tab == 'gallery'} ? 'is-on'" th:href="@{/admin/gallery}">Gallery</a>
  <a class="pill" th:classappend="${tab == 'pages'} ? 'is-on'" th:href="@{/admin/pages}">Pages</a>
</div>
